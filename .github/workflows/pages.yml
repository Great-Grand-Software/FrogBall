name: Deploy Pages

# Publishes the contents of the gh-pages branch as the Pages site.
#
# Why this exists, and why it is on main:
#
# The template's own deploy-main.yml publishes by PUSHING to gh-pages, which
# only serves anything when the Pages source is "Deploy from a branch". This
# repository's Pages source is "GitHub Actions", where a branch push is ignored
# and a workflow has to do the deploying instead.
#
# It has to run FROM the default branch. The github-pages environment's
# deployment branch policy allows only the default branch, and a push-triggered
# run executes from the branch that was pushed — so triggering this on a
# gh-pages push produced a run that the environment refused before any step
# ran. That is why there is no push:gh-pages trigger here: it could not ever
# work, and it left a failed run behind on every publish.
#
# So: dispatch it after pushing a build to gh-pages, or push to main.
#
# It builds nothing. It takes whatever is already on gh-pages and ships it, so
# it stays out of CI's way and does not duplicate the export.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race for the same site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the built site
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Where it went
        run: echo "Live at ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
