# Per-project configuration.
#
# This is the one file you edit when starting a new game from this template.
# Everything else in scripts/ and .github/ is project-neutral and can be
# carried forward untouched.
#
# Sourced by scripts/check-constraints.sh and by the smoke-test CI job, so
# keep it valid shell: KEY=value, no spaces around '='.

# Entry-point scenes the smoke test boots headless, space separated.
# Every scene a player can land on directly belongs here.
ENTRY_SCENES="res://scenes/main_menu.tscn res://scenes/game.tscn"

# Frame invariants. These are asserted against project.godot on every PR,
# because nothing else in CI re-derives them — a change here is a change to
# the shape of the game, and should be deliberate.
# Portrait, 9:16. Frog Ball is a climber: the run goes UP a narrow shaft, so the
# frame has to show the ledge being aimed at above the frog rather than a long
# run-up beside it. Mirrored in project.godot — change both or `constraints`
# fails.
VIEWPORT_WIDTH=720
VIEWPORT_HEIGHT=1280
STRETCH_ASPECT=keep

# gl_compatibility is what WebGL 2.0 needs. Changing this will build, and then
# fail to render in a browser, which is a slow way to find out.
RENDERER=gl_compatibility

# Guardrails. Raise deliberately, with a reason in the PR.
MAX_AUTOLOADS=1
MAX_RASTER_PX=512

# Set to 0 if your game is genuinely single-threaded-agnostic — but read
# CLAUDE.md first. The Web export cannot use threads at all.
MAX_WORKER_THREADS=0
